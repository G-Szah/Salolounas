<!DOCTYPE html>
<html lang="fi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salolounas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="header-left">
        <h1>🍽 Salolounas</h1>
        <p id="date-label"></p>
      </div>
      <button id="theme-toggle" aria-label="Vaihda teema" title="Vaihda teema">
        <span class="icon-sun">☀️</span>
        <span class="icon-moon">🌙</span>
      </button>
    </div>
  </header>

  <main>
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>Haetaan lounaslistoja…</p>
    </div>
    <div id="notice" class="notice hidden"></div>
    <div id="error" class="error hidden"></div>
    <div id="restaurants" class="grid"></div>
  </main>

  <footer>
    <p>Tiedot haetaan ravintoloiden omilta sivuilta ja LounasOpas.com:in ravintolakohtaisilta sivuilta</p>
  </footer>

  <script src="restaurants.js"></script>
  <script src="app.js"></script>
</body>
</html>
