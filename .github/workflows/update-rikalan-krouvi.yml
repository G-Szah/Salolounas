name: Paivita Rikalan Krouvi -lounas

on:
  schedule:
    - cron: '40 5 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-rikalan-krouvi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Hae Rikalan Krouvin tämän päivän lounas
        run: node scripts/update-rikalan-krouvi.mjs

      - name: Tallenna päivittynyt Rikalan Krouvi -data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/menus/rikalan-krouvi.json
          git diff --staged --quiet || git commit -m "chore: päivitä Rikalan Krouvi -lounas $(date -u +%Y-%m-%d)"
          git push
