name: Testaa Kespa-parseri

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test-kespa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Hae Kespan sivu ja testaa tämän päivän parsinta
        run: node scripts/test-kespa.mjs

      - name: Tallenna testitulokset repoon
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/debug/kespa-source.html data/debug/kespa-parsed.json
          git diff --staged --quiet || git commit -m "test: Kespa-parserin debug-tulos $(date -u +%Y-%m-%d)"
          git push
